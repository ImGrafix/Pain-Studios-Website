<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pain Studios - Player Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Courier New", Courier, monospace; }
        body { background-color: #0a0a0a; color: #eee; overflow-x: hidden; }

        /* Topbar */
        .topbar {
            background: linear-gradient(to bottom, #333 0%, #111 100%);
            border-bottom: 3px solid #900;
            height: 70px;
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
            display: flex; align-items: center; padding: 0 30px;
        }

        .logo { font-size: 1.4rem; font-weight: bold; color: #DC143C; text-shadow: 2px 2px #000; flex: 1; }
        .nav-container { flex: 2; display: flex; justify-content: center; }
        .auth-container { flex: 1; display: flex; justify-content: flex-end; gap: 8px; }

        /* Shared Button Style */
        .btn-retro {
            display: inline-block;
            padding: 8px 16px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ff3355 0%, #dc143c 50%, #800000 51%, #a00000 100%);
            border: 1px solid #000;
            border-radius: 3px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .btn-retro:hover { filter: brightness(1.2); }

        /* User Identity (Hidden by default) */
        #user-identity { display: none; align-items: center; }
        .username-display { color: #DC143C; font-weight: bold; cursor: pointer; text-decoration: underline; }

        /* Sliding Side Panel */
        .side-panel {
            position: fixed;
            top: 0; right: -300px; /* Hidden off-screen */
            width: 250px; height: 100%;
            background: #1a1a1a;
            border-left: 2px solid #DC143C;
            z-index: 3000;
            transition: 0.4s;
            padding: 20px;
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
        }
        .side-panel.open { right: 0; }
        .panel-header { border-bottom: 1px solid #444; padding-bottom: 10px; margin-bottom: 20px; color: #DC143C; }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content { background: #1a1a1a; border: 2px solid #DC143C; padding: 25px; width: 350px; }
        .input-group { margin-bottom: 15px; }
        .input-group input { width: 100%; padding: 10px; background: #000; border: 1px solid #444; color: #fff; }

        .container { margin-top: 150px; text-align: center; }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="logo">Pain Studios</div>
        
        <div class="nav-container">
            <button class="btn-retro">Home</button>
            <button class="btn-retro" style="margin-left: 5px;">Games</button>
        </div>

        <div class="auth-container">
            <div id="logged-out-tools">
                <button class="btn-retro" onclick="openModal('signupModal')">Sign Up</button>
                <button class="btn-retro" onclick="openModal('loginModal')">Log In</button>
            </div>
            <div id="user-identity">
                <span class="username-display" onclick="togglePanel()">PLAYER_01</span>
            </div>
        </div>
    </header>

    <div id="userPanel" class="side-panel">
        <div class="panel-header">PLAYER MENU</div>
        <p style="font-size: 12px; margin-bottom: 20px;">Logged in as: PLAYER_01</p>
        <button class="btn-retro" style="width: 100%;" onclick="logout()">Log Out</button>
        <button class="btn-retro" style="width: 100%; margin-top: 10px; background: #444;" onclick="togglePanel()">Close</button>
    </div>

    <div class="modal-overlay" id="loginModal">
        <div class="modal-content">
            <h2 style="color:#DC143C; text-align:center; margin-bottom:15px;">LOGIN</h2>
            <div class="input-group"><input type="text" id="loginUser" placeholder="Username"></div>
            <div class="input-group"><input type="password" placeholder="Password"></div>
            <button class="btn-retro" style="width: 100%;" onclick="login()">Enter System</button>
        </div>
    </div>

    <main class="container">
        <h1>PAIN STUDIOS</h1>
        <p id="status-text">System Status: Offline. Please log in.</p>
    </main>

    <script>
        const loggedOutTools = document.getElementById('logged-out-tools');
        const userIdentity = document.getElementById('user-identity');
        const userPanel = document.getElementById('userPanel');
        const statusText = document.getElementById('status-text');

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Simulate Login
        function login() {
            const name = document.getElementById('loginUser').value || "PLAYER_01";
            document.querySelector('.username-display').innerText = name.toUpperCase();
            
            closeModal('loginModal');
            loggedOutTools.style.display = 'none';
            userIdentity.style.display = 'flex';
            statusText.innerText = "Welcome back, " + name;
        }

        // Simulate Logout
        function logout() {
            togglePanel();
            loggedOutTools.style.display = 'flex';
            userIdentity.style.display = 'none';
            statusText.innerText = "System Status: Offline. Please log in.";
        }

        // Toggle Sidebar
        function togglePanel() {
            userPanel.classList.toggle('open');
        }
    </script>

</body>
</html>
