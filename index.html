<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Portal v2.0</title>
    <style>
        /* Flash Era Palette: Deep Grays, Vibrant Oranges/Blues, and Soft Glows */
        :root {
            --bg-dark: #1a1a1a;
            --panel-bg: #2d2d2d;
            --accent: #ff9900; /* Classic Newgrounds Orange */
            --border-glow: #444;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle, #333 1px, transparent 1px);
            background-size: 20px 20px; /* Subtle grid background */
            color: var(--text-color);
            font-family: 'Verdana', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
            margin: 0;
        }

        /* The Main Game Container */
        #site-container {
            width: 800px;
            background: var(--panel-bg);
            border: 4px solid #444;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
            overflow: hidden;
            position: relative;
        }

        /* Top Bar */
        header {
            background: linear-gradient(to bottom, #444, #222);
            padding: 10px 20px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 5px var(--accent);
        }

        /* Navigation Buttons */
        nav {
            background: #222;
            padding: 5px;
            display: flex;
            gap: 5px;
        }

        nav a {
            background: #3d3d3d;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.2s;
            border-bottom: 3px solid #1a1a1a;
        }

        nav a:hover {
            background: var(--accent);
            color: black;
            transform: translateY(-2px);
        }

        /* Main Content "Stage" */
        main {
            padding: 30px;
            text-align: center;
            min-height: 400px;
        }

        .loader-bar-bg {
            width: 100%;
            height: 20px;
            background: #111;
            border-radius: 10px;
            border: 1px solid #555;
            margin: 20px 0;
            overflow: hidden;
        }

        .loader-fill {
            width: 75%; /* Simulating a loading state */
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #ffcc00);
            box-shadow: 0 0 10px var(--accent);
        }

        .btn-play {
            display: inline-block;
            margin-top: 40px;
            padding: 20px 60px;
            background: linear-gradient(to bottom, #ffbb00, #ff8800);
            color: black;
            font-size: 1.5rem;
            font-weight: 900;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #995500, 0 10px 20px rgba(0,0,0,0.5);
            transition: 0.1s;
            cursor: pointer;
        }

        .btn-play:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #995500;
        }

        footer {
            background: #111;
            padding: 10px;
            font-size: 0.7rem;
            color: #666;
            text-align: center;
        }

    </style>
</head>
<body>

<div id="site-container">
    <header>
        <h1>ULTIMATE_PORTFOLIO_v1.swf</h1>
        <div style="color: #666; font-size: 0.8rem;">Quality: High</div>
    </header>

    <nav>
        <a href="#games">GAMES</a>
        <a href="#movies">MOVIES</a>
        <a href="#audio">AUDIO</a>
        <a href="#about">ABOUT</a>
    </nav>

    <main>
        <h2>LOADING ASSETS...</h2>
        <div class="loader-bar-bg">
            <div class="loader-fill"></div>
        </div>
        <p style="font-style: italic; color: #888;">"Tips: Press 'P' to pause... if this were a real game."</p>
        
        <a href="#" class="btn-play">PLAY NOW</a>
    </main>

    <footer>
        &copy; 2026 YourName Productions | Powered by "ActionScript 3.0" (Not really)
    </footer>
</div>

<p style="margin-top: 20px; font-size: 0.8rem; color: #555;">Get Adobe Flash Player to view this content.</p>

</body>
</html>
