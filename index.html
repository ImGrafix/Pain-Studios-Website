<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pain Studios - Instant Access</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Courier New", Courier, monospace; }
        body { background-color: #0a0a0a; color: #eee; overflow-x: hidden; }

        /* Topbar */
        .topbar {
            background: linear-gradient(to bottom, #333 0%, #111 100%);
            border-bottom: 3px solid #900;
            height: 70px;
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
            display: flex; align-items: center; padding: 0 30px;
        }

        .logo { font-size: 1.4rem; font-weight: bold; color: #DC143C; text-shadow: 2px 2px #000; flex: 1; }
        .nav-container { flex: 2; display: flex; justify-content: center; gap: 5px; }
        .auth-container { flex: 1; display: flex; justify-content: flex-end; gap: 8px; }

        /* Retro Crimson Buttons */
        .btn-retro {
            display: inline-block;
            padding: 8px 16px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #ff3355 0%, #dc143c 50%, #800000 51%, #a00000 100%);
            border: 1px solid #000;
            border-radius: 3px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .btn-retro:hover { filter: brightness(1.2); }

        /* Username styling */
        #user-identity { display: none; }
        .username-display { 
            color: #DC143C; 
            font-weight: bold; 
            cursor: pointer; 
            border: 1px solid #900;
            padding: 5px 15px;
            background: #000;
            text-transform: uppercase;
        }

        /* Side Panel */
        .side-panel {
            position: fixed;
            top: 0; right: -320px;
            width: 300px; height: 100%;
            background: #111;
            border-left: 3px solid #DC143C;
            z-index: 3000;
            transition: 0.3s ease-in-out;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }
        .side-panel.open { right: 0; }
        .panel-header { color: #DC143C; font-size: 1.2rem; border-bottom: 2px solid #900; padding-bottom: 10px; margin-bottom: 20px; }

        .stats-box { background: #000; border: 1px solid #333; padding: 15px; margin-bottom: 20px; }
        .stat-line { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
        .stat-value { color: #DC143C; font-weight: bold; }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center; align-items: center;
        }
        .modal-content { background: #1a1a1a; border: 2px solid #DC143C; padding: 25px; width: 350px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 10px; color: #666; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; background: #000; border: 1px solid #444; color: #fff; }

        .container { margin-top: 150px; text-align: center; }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="logo">Pain Studios</div>
        <div class="nav-container">
            <button class="btn-retro">Home</button>
            <button class="btn-retro">Games</button>
        </div>
        <div class="auth-container">
            <div id="logged-out-tools">
                <button class="btn-retro" onclick="showModal('signupModal')">Sign Up</button>
                <button class="btn-retro" onclick="showModal('loginModal')">Log In</button>
            </div>
            <div id="user-identity">
                <div class="username-display" onclick="togglePanel()">PLAYER_01</div>
            </div>
        </div>
    </header>

    <div id="userPanel" class="side-panel">
        <div class="panel-header">PLAYER PROFILE</div>
        <div class="stats-box">
            <div class="stat-line"><span>RANK:</span> <span class="stat-value">NOVICE</span></div>
            <div class="stat-line"><span>LEVEL:</span> <span class="stat-value">1</span></div>
            <div class="stat-line"><span>XP:</span> <span class="stat-value">0/500</span></div>
        </div>
        <button class="btn-retro" style="margin-top: auto;" onclick="handleLogout()">Terminate Session</button>
        <button style="background:none; border:none; color:#555; cursor:pointer; margin-top:10px;" onclick="togglePanel()">[ CLOSE ]</button>
    </div>

    <div id="loginModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color:#DC143C; margin-bottom:15px;">LOGIN</h2>
            <div class="input-group"><label>USERNAME</label><input type="text" id="loginUser" placeholder="Enter Name"></div>
            <div class="input-group"><label>PASSWORD</label><input type="password" placeholder="********"></div>
            <button class="btn-retro" style="width:100%" onclick="processAuth('loginUser')">Enter System</button>
            <button class="btn-retro" style="width:100%; margin-top:5px; background:#333;" onclick="hideModal('loginModal')">Cancel</button>
        </div>
    </div>

    <div id="signupModal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="color:#DC143C; margin-bottom:15px;">SIGN UP</h2>
            <div class="input-group"><label>CHOOSE USERNAME</label><input type="text" id="signupUser" placeholder="New Player"></div>
            <div class="input-group"><label>EMAIL</label><input type="email" placeholder="user@pain.com"></div>
            <div class="input-group"><label>PASSWORD</label><input type="password" placeholder="********"></div>
            <button class="btn-retro" style="width:100%" onclick="processAuth('signupUser')">Initialize & Join</button>
            <button class="btn-retro" style="width:100%; margin-top:5px; background:#333;" onclick="hideModal('signupModal')">Back</button>
        </div>
    </div>

    <main class="container">
        <h1>PAIN STUDIOS</h1>
        <p>Authentication System: <span id="auth-status" style="color:#666">Ready</span></p>
    </main>

    <script>
        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function hideModal(id) { document.getElementById(id).style.display = 'none'; }

        // Combined logic for login and signup success
        function processAuth(inputId) {
            const name = document.getElementById(inputId).value || "PLAYER_01";
            
            // Switch UI to logged in state
            document.querySelector('.username-display').innerText = name.toUpperCase();
            document.getElementById('logged-out-tools').style.display = 'none';
            document.getElementById('user-identity').style.display = 'block';
            
            // Update Main Text
            document.getElementById('auth-status').innerText = "Authorized: " + name;
            document.getElementById('auth-status').style.color = "#DC143C";
            
            // Close whichever modal was open
            hideModal('loginModal');
            hideModal('signupModal');
        }

        function handleLogout() {
            togglePanel();
            document.getElementById('logged-out-tools').style.display = 'flex';
            document.getElementById('user-identity').style.display = 'none';
            document.getElementById('auth-status').innerText = "Ready";
            document.getElementById('auth-status').style.color = "#666";
        }

        function togglePanel() {
            document.getElementById('userPanel').classList.toggle('open');
        }

        window.onclick = function(event) {
            if (event.target.className === 'modal-overlay') {
                event.target.style.display = 'none';
            }
        }
    </script>
</body>
</html>
